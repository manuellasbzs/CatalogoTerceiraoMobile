<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Terceirão Mobile 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body { background: #000; color: #fff; font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
  section {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(24px, 6vw, 64px) clamp(16px, 5vw, 40px);
    text-align: center;
  }
  .kicker {
    color: #a855f7;
    letter-spacing: clamp(3px, 1.2vw, 6px);
    font-size: clamp(11px, 2.6vw, 14px);
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  h1 {
    font-size: clamp(34px, 9vw, 88px);
    line-height: 1.05;
    text-transform: uppercase;
    letter-spacing: -1px;
    word-wrap: break-word;
  }
  h1 span { color: #a855f7; }
  h2 {
    font-size: clamp(28px, 7vw, 64px);
    line-height: 1.1;
    text-transform: uppercase;
    margin-bottom: clamp(20px, 4vw, 32px);
  }
  p.sub {
    color: rgba(255,255,255,0.7);
    margin-top: 20px;
    max-width: 480px;
    font-size: clamp(14px, 2.4vw, 16px);
    padding: 0 8px;
  }
  .arrow {
    color: #a855f7;
    font-size: clamp(24px, 5vw, 32px);
    margin-top: clamp(28px, 6vw, 40px);
    animation: bounce 1.5s infinite;
  }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(10px)} }
  .card {
    max-width: 900px;
    width: 100%;
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: clamp(10px, 2vw, 16px);
    overflow: hidden;
    box-shadow: 0 0 60px -10px rgba(168,85,247,0.5);
    background: #0a0a0a;
  }
  .card img {
    width: 100%;
    height: auto;
    max-height: 75vh;
    object-fit: contain;
    display: block;
  }
  footer {
    border-top: 1px solid rgba(168,85,247,0.2);
    padding: 24px 16px;
    text-align: center;
    color: rgba(255,255,255,0.5);
    font-size: clamp(12px, 2.4vw, 14px);
  }

  @media (max-width: 480px) {
    section { min-height: auto; padding: 56px 16px; }
    section:first-of-type { min-height: 100svh; }
  }
</style>
</head>
<body>
  <section>
    <p class="kicker">Cotemig · 2026</p>
    <h1>Terceirão <span>Mobile</span></h1>
    <p class="sub">Catálogo de produtos. Role para baixo para conferir.</p>
    <div class="arrow">↓</div>
  </section>

  <section>
    <h2>Camisa</h2>
    <div class="card"><img src="camisa.png" alt="Camisa"></div>
  </section>

  <section>
    <h2>Camisa Polo</h2>
    <div class="card"><img src="polo.png" alt="Camisa Polo"></div>
  </section>

  <section>
    <h2>Moletom</h2>
    <div class="card"><img src="moletom.png" alt="Moletom"></div>
  </section>

  <section>
    <h2>Caneca</h2>
    <div class="card"><img src="caneca.png" alt="Caneca"></div>
  </section>

  <footer>Terceirão Mobile · Cotemig 2026</footer>
</body>
</html>
