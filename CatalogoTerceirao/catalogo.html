<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Terceirão Mobile 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #fff; font-family: Arial, Helvetica, sans-serif; }
  section {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }
  .kicker { color: #a855f7; letter-spacing: 6px; font-size: 14px; margin-bottom: 16px; text-transform: uppercase; }
  h1 { font-size: clamp(40px, 8vw, 88px); text-transform: uppercase; letter-spacing: -2px; }
  h1 span { color: #a855f7; }
  h2 { font-size: clamp(32px, 6vw, 64px); text-transform: uppercase; margin-bottom: 32px; }
  p.sub { color: rgba(255,255,255,0.7); margin-top: 20px; max-width: 480px; }
  .arrow { color: #a855f7; font-size: 32px; margin-top: 40px; animation: bounce 1.5s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(10px)} }
  .card {
    max-width: 900px;
    width: 100%;
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 60px -10px rgba(168,85,247,0.5);
  }
  .card img { width: 100%; height: auto; display: block; }
  footer { border-top: 1px solid rgba(168,85,247,0.2); padding: 24px; text-align: center; color: rgba(255,255,255,0.5); font-size: 14px; }
</style>
</head>
<body>
  <section>
    <p class="kicker">Cotemig · 2026</p>
    <h1>Terceirão <span>Mobile</span></h1>
    <p class="sub">Catálogo de produtos. Role para baixo para conferir.</p>
    <div class="arrow">↓</div>
  </section>

  <section>
    <h2>Camisa</h2>
    <div class="card"><img src="camisa.png" alt="Camisa"></div>
  </section>

  <section>
    <h2>Camisa Polo</h2>
    <div class="card"><img src="polo.png" alt="Camisa Polo"></div>
  </section>

  <section>
    <h2>Moletom</h2>
    <div class="card"><img src="moletom.png" alt="Moletom"></div>
  </section>

  <section>
    <h2>Caneca</h2>
    <div class="card"><img src="caneca.png" alt="Caneca"></div>
  </section>

  <footer>Terceirão Mobile · Cotemig 2026</footer>
</body>
</html>
